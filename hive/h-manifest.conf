# ARC-miner — HiveOS custom miner manifest
# Installed to: /hive/miners/custom/arc-miner/
CUSTOM_NAME=arc-miner
# Kept in step with ../version.txt by package.sh at packaging time — edit
# version.txt, not this line.
CUSTOM_VERSION=0.3.2
CUSTOM_BUILD=1

# Config + log files HiveOS will manage for us.
CUSTOM_CONFIG_FILENAME=/hive/miners/custom/$CUSTOM_NAME/arc-miner.conf
CUSTOM_LOG_BASENAME=/var/log/miner/$CUSTOM_NAME/$CUSTOM_NAME

# Local stats API port (arc-miner --api-port). h-stats.sh scrapes this.
CUSTOM_API_PORT=4067
