# ARC-miner OC — sourced by h-run.sh at miner start (as root).
# Persists across HiveOS flight-sheet pushes (they only regenerate the .conf).
# Edit a value, then restart the miner (HiveOS: miner restart / re-apply flight sheet).
# Leave everything commented for STOCK behaviour (nothing is written to sysfs).
#
# This rig's Intel Arc B580s: core clock 400–2850 MHz (stock max 2850, no headroom
# above that via sysfs), power cap 205 W stock / 410 W crit.
#
# --- core clock ---
# Pin clock (sets both min and max) — stability/consistency, or lower for efficiency:
#LOCK_MHZ=2850
# Or set floor / ceiling independently (ignored when LOCK_MHZ is set):
#MIN_MHZ=
#MAX_MHZ=
#
# --- power ---
# Per-GPU power cap in watts. Raise toward 410 to help hold clocks under load,
# or lower to cut power draw at a small hashrate cost:
#POWER_W=205
